name: windows-agent-ci

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - develop
  pull_request:
    branches:
      - dev
      - develop
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore Projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem src,tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem src,tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $projects) {
            dotnet build $project.FullName -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Tests
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $testProjects) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($project.Name)
            dotnet test $project.FullName -c Release --no-build --logger "trx;LogFileName=$name.trx"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build MSI and logo setup for CI inspection
        shell: pwsh
        run: |
          ./scripts/build-agent-ci-packages.ps1 -OutputRoot out/ci

      - name: Upload Published Agent
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-windows-agent-win-x64
          path: |
            out/ci/publish/Cerberus.Agent-dev-0.0.0.msi
            out/ci/publish/Cerberus.Agent-dev-0.0.0.exe
          if-no-files-found: error
