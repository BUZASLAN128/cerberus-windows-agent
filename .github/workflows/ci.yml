name: windows-agent-ci

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - develop
  pull_request:
    branches:
      - dev
      - develop
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem src,tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $projects) {
            dotnet restore $project.FullName
          }

      - name: Build Projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem src,tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $projects) {
            dotnet build $project.FullName -c Release --no-restore
          }

      - name: Run Tests
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $testProjects) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($project.Name)
            dotnet test $project.FullName -c Release --no-build --logger "trx;LogFileName=$name.trx"
          }

      - name: Publish Win-x64 Single File
        run: >
          dotnet publish src/Cerberus.Agent.App/Cerberus.Agent.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out/ci/publish

      - name: Upload Published Agent
        uses: actions/upload-artifact@v4
        with:
          name: cerberus-windows-agent-win-x64
          path: out/ci/publish/
          if-no-files-found: error
