name: windows-agent-ci

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - develop
  pull_request:
    # ready_for_review: marking a draft ready runs the whole check (drafts are skipped below).
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dev
      - develop
  workflow_dispatch:

jobs:
  build-test-publish:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tests: ${{ (steps.restore.outcome == 'failure' || steps.build.outcome == 'failure' || steps.tests.outcome == 'failure') && 'failure' || steps.tests.outcome }}
      updateTests: ${{ steps.update_tests.outcome }}
      packages: ${{ (steps.pkg_desktop.outcome == 'failure' || steps.pkg_server.outcome == 'failure') && 'failure' || steps.pkg_server.outcome }}
      releaseGate: ${{ steps.release_gate.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore Projects
        id: restore
        shell: pwsh
        run: |
          $projects = Get-ChildItem src,tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $projects) {
            dotnet restore $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build Projects
        id: build
        shell: pwsh
        run: |
          $projects = Get-ChildItem src,tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $projects) {
            dotnet build $project.FullName -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Tests
        id: tests
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem tests -Recurse -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
          foreach ($project in $testProjects) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($project.Name)
            dotnet test $project.FullName -c Release --no-build --logger "trx;LogFileName=$name.trx" --results-directory "out/ci-test-results/desktop/$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test server updater recovery and native storage guards
        id: update_tests
        shell: pwsh
        run: ./scripts/test-agent-update-ci.ps1 -OutputRoot out/ci-test-results/server

      - name: Build desktop MSI and setup for CI inspection
        id: pkg_desktop
        shell: pwsh
        run: |
          ./scripts/build-agent-ci-packages.ps1 -OutputRoot out/ci/desktop

      - name: Build server MSI and exercise updater authorization denial
        id: pkg_server
        shell: pwsh
        run: |
          ./scripts/build-agent-ci-packages.ps1 -OutputRoot out/ci/server -BuildProfile server

      # The same lab-metadata gate the official release build runs on a non-lab build (#94/#95).
      - name: Release gate on the unsigned non-lab bundles
        id: release_gate
        shell: pwsh
        run: |
          . ./scripts/release-trust-lib.ps1
          $helper = 'src/Cerberus.Agent.Installer/Helper/bin/Release/net10.0-windows/win-x64/Cerberus.Agent.Installer.Helper.dll'
          foreach ($buildProfile in 'desktop', 'server') {
            Assert-NoLabCampaignMetadata "out/ci/$buildProfile/publish/runtime" -ExtraAssemblies @($helper)
          }

      - name: Retain test and package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-agent-ci-evidence-${{ github.sha }}
          path: |
            out/ci-test-results/**
            out/ci/**/ci-package-proof.json
            out/ci/**/updater-denial.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Published Agent
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-windows-agent-win-x64
          path: |
            out/ci/desktop/publish/Cerberus.Agent-dev-0.0.0.msi
            out/ci/desktop/publish/Cerberus.Agent-dev-0.0.0.exe
            out/ci/server/publish/Cerberus.Agent-dev-0.0.0-server.msi
            out/ci/server/publish/Cerberus.Agent-dev-0.0.0-server.exe
          retention-days: 7
          if-no-files-found: error

  # One PR comment with the AGENTS.md Work Rules stage table for this head; CI cannot run the VM, signing,
  # 10+10, return/feed or publication stages, so they stay NOT RUN there.
  ready-status:
    needs: build-test-publish
    if: >-
      always() && github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: No release on dev pushes
        id: publish_guard
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-no-release-on-push.ps1

      - name: Post the stage table
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTS: ${{ needs.build-test-publish.outputs.tests }}
          UPDATE_TESTS: ${{ needs.build-test-publish.outputs.updateTests }}
          PACKAGES: ${{ needs.build-test-publish.outputs.packages }}
          RELEASE_GATE: ${{ needs.build-test-publish.outputs.releaseGate }}
          PUBLISH_GUARD: ${{ steps.publish_guard.outcome }}
        run: |
          ./scripts/ci-ready-status.ps1 -Repository $env:GITHUB_REPOSITORY -PullRequest $env:PR -HeadSha $env:HEAD_SHA `
            -RunUrl $env:RUN_URL -Outcomes @{ tests = $env:TESTS; updateTests = $env:UPDATE_TESTS; packages = $env:PACKAGES
              releaseGate = $env:RELEASE_GATE; publishGuard = $env:PUBLISH_GUARD }

      - name: Fail when a workflow publishes on push
        if: steps.publish_guard.outcome == 'failure'
        shell: pwsh
        run: throw 'An active workflow publishes a release on push (see the publish guard step).'
