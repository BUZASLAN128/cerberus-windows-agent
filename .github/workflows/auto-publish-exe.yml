name: public-agent-release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Required. Example: 1.2.0"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "preview"
        type: choice
        options:
          - dev
          - preview
          - stable
      release_notes:
        description: "Optional custom release notes"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build gated release bundle
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          AGENT_UPDATE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.AGENT_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          AGENT_RELEASE_ARTIFACT_BASE_URL: ${{ vars.AGENT_RELEASE_ARTIFACT_BASE_URL }}
        run: >
          ./scripts/build-public-release.ps1
          -Version "${{ inputs.release_version }}"
          -Channel "${{ inputs.channel }}"

      - name: Compute release metadata
        id: meta
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}"
          $channel = "${{ inputs.channel }}"
          $tag = if ($version.StartsWith("v")) { $version } else { "v$version" }
          $cleanVersion = if ($version.StartsWith("v")) { $version.Substring(1) } else { $version }
          $assetBase = "Cerberus.Agent.App-$channel-$cleanVersion"
          $notes = "${{ inputs.release_notes }}"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Public Cerberus Windows Agent $channel release."
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $notes | Set-Content -Path out/release-notes.md -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_base=$assetBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "make_latest=$(if ($channel -eq 'stable') { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$(if ($channel -eq 'stable') { 'false' } else { 'true' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload gated release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerberus-windows-agent-${{ inputs.channel }}-${{ inputs.release_version }}
          path: out/public-release/publish/
          if-no-files-found: error

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: Cerberus Windows Agent ${{ inputs.release_version }} (${{ inputs.channel }})
          prerelease: ${{ steps.meta.outputs.prerelease }}
          makeLatest: ${{ steps.meta.outputs.make_latest }}
          allowUpdates: false
          bodyFile: out/release-notes.md
          artifacts: |
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.exe
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.zip
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.sha256
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.sbom.json
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.provenance.json
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.release-gate.json
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.update-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
