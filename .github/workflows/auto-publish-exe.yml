name: public-agent-release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Required. Example: 1.2.0"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "preview"
        type: choice
        options:
          - dev
          - preview
          - stable
      release_notes:
        description: "Optional custom release notes"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish-exe:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build gated release bundle
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          AGENT_UPDATE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.AGENT_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          AGENT_RELEASE_ARTIFACT_BASE_URL: ${{ vars.AGENT_RELEASE_ARTIFACT_BASE_URL }}
          CERBERUS_BACKEND_URL: ${{ vars.CERBERUS_BACKEND_URL }}
          CERBERUS_SSO_BASE_URL: ${{ vars.CERBERUS_SSO_BASE_URL }}
          CERBERUS_SSO_CLIENT_ID: ${{ vars.CERBERUS_SSO_CLIENT_ID }}
          CERBERUS_SSO_SCOPE: ${{ vars.CERBERUS_SSO_SCOPE }}
          CERBERUS_OAUTH_REDIRECT_PORT: ${{ vars.CERBERUS_OAUTH_REDIRECT_PORT }}
        run: |
          $args = @(
            "-Version", "${{ inputs.release_version }}",
            "-Channel", "${{ inputs.channel }}"
          )
          if ("${{ inputs.channel }}" -eq "dev") {
            $args += "-AllowUnsignedDevBuild"
          }
          ./scripts/build-public-release.ps1 @args

      - name: Compute release metadata
        id: meta
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}"
          $channel = "${{ inputs.channel }}"
          $tag = if ($version.StartsWith("v")) { $version } else { "v$version" }
          $cleanVersion = if ($version.StartsWith("v")) { $version.Substring(1) } else { $version }
          $assetBase = "Cerberus.Agent.App-$channel-$cleanVersion"
          $setupBase = "Cerberus.Agent.Setup-$channel-$cleanVersion"
          $notes = "${{ inputs.release_notes }}"
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Public Cerberus Windows Agent $channel release."
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $notes | Set-Content -Path out/release-notes.md -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_base=$assetBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_base=$setupBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "make_latest=$(if ($channel -eq 'stable') { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$(if ($channel -eq 'stable') { 'false' } else { 'true' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload gated release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-windows-agent-${{ inputs.channel }}-${{ inputs.release_version }}
          path: out/public-release/publish/
          if-no-files-found: error

      - name: Create GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: Cerberus Windows Agent ${{ inputs.release_version }} (${{ inputs.channel }})
          prerelease: ${{ steps.meta.outputs.prerelease }}
          makeLatest: ${{ steps.meta.outputs.make_latest }}
          allowUpdates: false
          bodyFile: out/release-notes.md
          artifacts: |
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.exe
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.zip
            out/public-release/publish/${{ steps.meta.outputs.setup_base }}.msi
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.sha256
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.sbom.json
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.provenance.json
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.release-gate.json
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.update-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update preview latest release
        if: ${{ inputs.channel == 'preview' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview-latest --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "preview-latest was not present or could not be deleted; continuing with create."
            $global:LASTEXITCODE = 0
          }
          gh release create preview-latest `
            out/public-release/publish/${{ steps.meta.outputs.setup_base }}.msi `
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.exe `
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.zip `
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.sha256 `
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.sbom.json `
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.provenance.json `
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.release-gate.json `
            out/public-release/publish/${{ steps.meta.outputs.asset_base }}.update-manifest.json `
            --title "Cerberus Windows Agent preview-latest" `
            --notes-file out/release-notes.md `
            --prerelease
