name: public-agent-release

on:
  push:
    branches:
      - dev
      - develop
    paths:
      - ".github/workflows/auto-publish-exe.yml"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "**/*.sln"
      - "**/*.csproj"
      - "src/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Required. Example: 1.2.0"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: true
        default: "preview"
        type: choice
        options:
          - dev
          - preview
          - stable
      release_notes:
        description: "Optional custom release notes"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: public-agent-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-exe:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve release inputs
        id: release
        shell: pwsh
        env:
          DISPATCH_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          CERBERUS_EVENT_NAME: ${{ github.event_name }}
          CERBERUS_REF: ${{ github.ref }}
          CERBERUS_REF_NAME: ${{ github.ref_name }}
          CERBERUS_WORKFLOW_SHA: ${{ github.sha }}
          CERBERUS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:CERBERUS_EVENT_NAME -ceq "workflow_dispatch") {
            $version = $env:DISPATCH_RELEASE_VERSION
            $channel = $env:DISPATCH_CHANNEL
            $notes = $env:DISPATCH_RELEASE_NOTES
            if ([string]::IsNullOrWhiteSpace($notes)) {
              $notes = "Public Cerberus Windows Agent $channel release."
            }
          } else {
            $shortSha = $env:CERBERUS_WORKFLOW_SHA.Substring(0, 12)
            $channel = "dev"
            $notes = "Automated local-development release from $env:CERBERUS_REF_NAME@$shortSha. Not for customer production use."
            $tagRefs = git ls-remote --tags origin "refs/tags/v0.2.*-$channel.*"
            $maxPatch = 0
            foreach ($line in $tagRefs) {
              if ($line -match "refs/tags/v0\.2\.(\d+)-$channel\.(\d+)$") {
                $maxPatch = [Math]::Max($maxPatch, [Math]::Max([int]$Matches[1], [int]$Matches[2]))
              }
            }
            $nextPatch = [Math]::Max([int]$env:CERBERUS_RUN_NUMBER, $maxPatch + 1)
            $version = "0.2.$nextPatch-$channel.$nextPatch"
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "release_version is required."
          }
          if ($channel -cnotin @("dev", "preview", "stable")) {
            throw "Unsupported release channel: $channel"
          }
          $eventName = $env:CERBERUS_EVENT_NAME
          $ref = $env:CERBERUS_REF
          $integrationRefs = @("refs/heads/dev", "refs/heads/develop")
          if ($eventName -ceq "push") {
            if ($ref -cnotin $integrationRefs -or $channel -cne "dev") {
              throw "Automatic releases are limited to dev/develop pushes using the dev channel."
            }
          } elseif ($eventName -ceq "workflow_dispatch" -and $ref -ceq "refs/heads/main") {
            if ($channel -cne "stable") {
              throw "Manual main releases require the stable channel."
            }
          } elseif ($eventName -ceq "workflow_dispatch" -and $ref -cin $integrationRefs) {
            if ($channel -cnotin @("dev", "preview")) {
              throw "Manual dev/develop releases allow only dev or preview channels."
            }
          } else {
            throw "Unsupported release ref/event. Use workflow_dispatch on main for stable or dev/develop for dev/preview."
          }

          $versionPattern = '\Av?(?<normalized>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)\z'
          $versionMatch = [regex]::Match(
            $version,
            $versionPattern,
            [System.Text.RegularExpressions.RegexOptions]::CultureInvariant)
          if (-not $versionMatch.Success) {
            throw "release_version must be an ASCII SemVer value (for example, 1.2.3 or 1.2.3-preview.1)."
          }
          # Keep producer asset names numeric while retaining the canonical v-prefixed tag.
          $version = $versionMatch.Groups["normalized"].Value
          $tag = "v$version"
          $assetBase = "Cerberus.Agent.Bundle-$channel-$version"
          $installerBase = "Cerberus.Agent-$channel-$version"

          New-Item -ItemType Directory -Force -Path out | Out-Null
          $notes | Set-Content -Path out/release-notes.md -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_base=$assetBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_base=$installerBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "make_latest=$(if ($channel -ceq 'stable') { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$(if ($channel -ceq 'stable') { 'false' } else { 'true' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build gated release bundle
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          AGENT_UPDATE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.AGENT_UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          AGENT_RELEASE_ARTIFACT_BASE_URL: ${{ vars.AGENT_RELEASE_ARTIFACT_BASE_URL }}
          CERBERUS_AGENT_UPDATE_MANIFEST_PUBLIC_KEYS_B64: ${{ vars.CERBERUS_AGENT_UPDATE_MANIFEST_PUBLIC_KEYS_B64 }}
          CERBERUS_AGENT_UPDATE_MANIFEST_PUBLIC_KEY_B64: ${{ vars.AGENT_UPDATE_MANIFEST_PUBLIC_KEY_B64 }}
          CERBERUS_AGENT_UPDATE_ALLOWED_ARTIFACT_PREFIXES: ${{ vars.AGENT_UPDATE_ALLOWED_ARTIFACT_PREFIXES }}
          CERBERUS_BACKEND_URL: ${{ vars.CERBERUS_BACKEND_URL }}
          CERBERUS_SSO_BASE_URL: ${{ vars.CERBERUS_SSO_BASE_URL }}
          CERBERUS_SSO_CLIENT_ID: ${{ vars.CERBERUS_SSO_CLIENT_ID }}
          CERBERUS_SSO_SCOPE: ${{ vars.CERBERUS_SSO_SCOPE }}
          CERBERUS_OAUTH_REDIRECT_PORT: ${{ vars.CERBERUS_OAUTH_REDIRECT_PORT }}
          CERBERUS_RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          CERBERUS_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CERBERUS_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $channel = $env:CERBERUS_RELEASE_CHANNEL
          $version = $env:CERBERUS_RELEASE_VERSION
          if ($channel -ceq "stable") {
            # Bind stable manifests to this immutable versioned release. The
            # stable pointer only selects the signed manifest; it never hosts
            # the installer payload itself.
            $env:AGENT_RELEASE_ARTIFACT_BASE_URL = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:CERBERUS_RELEASE_TAG"
          }
          if ($channel -ceq "dev") {
            ./scripts/build-agent-public-release.ps1 `
              -Version $version `
              -Channel $channel `
              -AllowUnsignedDevBuild
          } else {
            ./scripts/build-agent-public-release.ps1 `
              -Version $version `
              -Channel $channel
          }

      - name: Upload gated release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-windows-agent-${{ steps.release.outputs.channel }}-${{ steps.release.outputs.version }}
          path: out/public-release/publish/
          if-no-files-found: error

      - name: Create GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.release.outputs.tag }}
          name: Cerberus Windows Agent ${{ steps.release.outputs.version }} (${{ steps.release.outputs.channel }})
          prerelease: ${{ steps.release.outputs.prerelease }}
          makeLatest: ${{ steps.release.outputs.make_latest }}
          allowUpdates: false
          artifactErrorsFailBuild: true
          immutableCreate: ${{ steps.release.outputs.channel == 'stable' }}
          bodyFile: out/release-notes.md
          artifacts: |
            out/public-release/publish/${{ steps.release.outputs.asset_base }}.zip
            out/public-release/publish/${{ steps.release.outputs.setup_base }}.msi
            out/public-release/publish/${{ steps.release.outputs.asset_base }}.sha256
            out/public-release/publish/${{ steps.release.outputs.asset_base }}.sbom.json
            out/public-release/publish/${{ steps.release.outputs.asset_base }}.provenance.json
            out/public-release/publish/${{ steps.release.outputs.asset_base }}.release-gate.json
            out/public-release/publish/${{ steps.release.outputs.asset_base }}.update-manifest.json
            out/public-release/publish/${{ steps.release.outputs.asset_base }}.update-manifest.v2.json
            out/public-release/publish/Cerberus.Agent.Bundle-${{ steps.release.outputs.channel }}-latest.update-manifest.v2.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update channel latest release
        if: ${{ steps.release.outputs.channel != 'stable' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERBERUS_RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          CERBERUS_RELEASE_SETUP_BASE: ${{ steps.release.outputs.setup_base }}
          CERBERUS_RELEASE_ASSET_BASE: ${{ steps.release.outputs.asset_base }}
          CERBERUS_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          $channel = $env:CERBERUS_RELEASE_CHANNEL
          $setupBase = $env:CERBERUS_RELEASE_SETUP_BASE
          $assetBase = $env:CERBERUS_RELEASE_ASSET_BASE
          $workflowSha = $env:CERBERUS_WORKFLOW_SHA
          $latestTag = "$channel-latest"
          $latestAssetBase = "Cerberus.Agent.Bundle-$channel-latest"
          $latestInstallerBase = "Cerberus.Agent-$channel-latest"
          gh release delete $latestTag --yes --cleanup-tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "$latestTag was not present or could not be deleted; continuing with create."
            $global:LASTEXITCODE = 0
          }
          $latestReleaseOptions = @(
            "--title", "Cerberus Windows Agent $latestTag",
            "--notes-file", "out/release-notes.md",
            "--latest=false",
            "--target", $workflowSha
          )
          if ($channel -cne "stable") {
            $latestReleaseOptions += "--prerelease"
          }
          & gh release create $latestTag `
            "out/public-release/publish/$setupBase.msi" `
            "out/public-release/publish/$assetBase.zip" `
            "out/public-release/publish/$assetBase.sha256" `
            "out/public-release/publish/$assetBase.sbom.json" `
            "out/public-release/publish/$assetBase.provenance.json" `
            "out/public-release/publish/$assetBase.release-gate.json" `
            "out/public-release/publish/$assetBase.update-manifest.json" `
            "out/public-release/publish/$assetBase.update-manifest.v2.json" `
            "out/public-release/publish/$latestInstallerBase.msi" `
            "out/public-release/publish/$latestAssetBase.zip" `
            "out/public-release/publish/$latestAssetBase.sha256" `
            "out/public-release/publish/$latestAssetBase.sbom.json" `
            "out/public-release/publish/$latestAssetBase.provenance.json" `
            "out/public-release/publish/$latestAssetBase.release-gate.json" `
            "out/public-release/publish/$latestAssetBase.update-manifest.json" `
            "out/public-release/publish/$latestAssetBase.update-manifest.v2.json" `
            @latestReleaseOptions
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish the $channel-latest release alias."
          }
