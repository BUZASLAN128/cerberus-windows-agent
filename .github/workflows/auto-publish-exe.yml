name: auto-publish-exe

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-dev-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Win-x64 EXE
        run: >
          dotnet publish src/Cerberus.Agent.App/Cerberus.Agent.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out/release

      - name: Prepare Release Asset
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 8)
          $assetName = "Cerberus.Agent.App-dev-$sha.exe"
          Copy-Item "out/release/Cerberus.Agent.App.exe" "out/release/$assetName" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerberus-windows-agent-dev-exe
          path: out/release/*.exe
          if-no-files-found: error

      - name: Create Dev Pre-Release
        uses: ncipollo/release-action@v1
        with:
          tag: dev-${{ github.run_number }}
          name: Dev Build ${{ github.run_number }}
          prerelease: true
          makeLatest: false
          artifacts: out/release/Cerberus.Agent.App-dev-*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
