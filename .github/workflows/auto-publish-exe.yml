name: auto-publish-exe

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Win-x64 EXE
        run: >
          dotnet publish src/Cerberus.Agent.App/Cerberus.Agent.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out/release

      - name: Compute Release Metadata
        id: meta
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $safeBranch = $branch -replace '[^A-Za-z0-9._-]', '-'
          $sha = "${{ github.sha }}".Substring(0, 8)
          $tag = "auto-$safeBranch-${{ github.run_number }}-$sha"
          $name = "Auto Build $safeBranch #${{ github.run_number }}"
          "safe_branch=$safeBranch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "short_sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare Release Asset
        shell: pwsh
        run: |
          $safeBranch = "${{ steps.meta.outputs.safe_branch }}"
          $sha = "${{ steps.meta.outputs.short_sha }}"
          $assetName = "Cerberus.Agent.App-$safeBranch-$sha.exe"
          Copy-Item "out/release/Cerberus.Agent.App.exe" "out/release/$assetName" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerberus-windows-agent-${{ steps.meta.outputs.safe_branch }}-exe
          path: out/release/*.exe
          if-no-files-found: error

      - name: Create Auto Pre-Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          makeLatest: false
          artifacts: out/release/Cerberus.Agent.App-${{ steps.meta.outputs.safe_branch }}-${{ steps.meta.outputs.short_sha }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}
