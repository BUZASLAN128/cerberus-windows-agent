<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t d">
  <title id="t">Cerberus Windows ajanı: operatör yolu ve güncelleme yolu</title>
  <desc id="d">Operatör portaldan arka uca bağlanır; Windows servisi arka uçla HTTPS ve imzalı isteklerle konuşur, yerel Windows verisini okur, isteğe bağlı tepsi uygulamasıyla çalışır. Güncelleme ayrı bir hattır ve arka uç sinyaliyle ya da zamanlı denetimle başlar: imzalı manifest ve MSI HTTPS ile iner, servis uzunluk ve SHA-256 özetini doğrulayıp korumalı klasöre alır, uygulama klasörünün dışındaki korumalı kopyadan çalışan ayrı güncelleyici süreç denetimleri yineleyip MSI kurulumunu başlatır, kurulum servis sağlığını denetler ve sağlıksızsa geri alınır; sonuç heartbeat ile arka uca gider. Güvenlik notları normal sürüm yolunu anlatır; süreli geliştirme kampanyası şemada yer almaz.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#59636e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h1 { font-size: 20px; font-weight: 600; }
      .lane { font-size: 13px; font-weight: 600; fill: #59636e; }
      .note { font-size: 12.5px; fill: #59636e; }
      .bt { font-size: 15px; font-weight: 600; }
      .st { font-size: 14px; font-weight: 600; }
      .bd { font-size: 12.5px; fill: #424a53; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; font-size: 11.5px; fill: #424a53; }
      .lbl { font-size: 12.5px; fill: #424a53; }
      .pill { font-size: 12.5px; font-weight: 600; fill: #0550ae; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #c4cbd3; stroke-width: 1; }
      .opt { fill: #ffffff; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 5 4; }
      .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
      .mk { fill: #0969da; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="699" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text class="h1" x="32" y="42">Cerberus Windows ajanı: bağlantı ve güncelleme</text>

  <!-- 1. Operatör yolu -->
  <rect x="20" y="62" width="920" height="232" rx="10" fill="#f6f8fa"/>
  <text class="lane" x="36" y="86">Operatör yolu</text>

  <rect class="box" x="40" y="104" width="150" height="76" rx="8"/>
  <text class="bt" x="56" y="134">Operatör</text>
  <text class="bd" x="56" y="156">Cerberus portalı</text>

  <rect class="box" x="230" y="104" width="160" height="76" rx="8"/>
  <text class="bt" x="246" y="134">Cerberus arka ucu</text>
  <text class="bd" x="246" y="156">API, toplayıcı</text>

  <rect class="box" x="580" y="104" width="170" height="76" rx="8"/>
  <text class="bt" x="596" y="132">Windows servisi</text>
  <text class="mono" x="596" y="152">Cerberus.Agent.Service</text>
  <text class="bd" x="596" y="170">komutları yürütür</text>

  <rect class="box" x="780" y="104" width="140" height="76" rx="8"/>
  <text class="bt" x="796" y="132">Yerel veri</text>
  <text class="bd" x="796" y="152">olay günlüğü,</text>
  <text class="bd" x="796" y="170">servisler, ağ, RDP</text>

  <line class="line" x1="190" y1="142" x2="228" y2="142" marker-end="url(#arrow)"/>
  <!-- service -> backend: heartbeat and telemetry; backend -> service: commands in the reply -->
  <text class="lbl" x="485" y="122" text-anchor="middle">heartbeat, telemetri</text>
  <line class="line" x1="578" y1="130" x2="392" y2="130" marker-end="url(#arrow)"/>
  <line class="line" x1="392" y1="156" x2="578" y2="156" marker-end="url(#arrow)"/>
  <text class="lbl" x="485" y="174" text-anchor="middle">komutlar</text>
  <line class="line" x1="780" y1="142" x2="752" y2="142" marker-end="url(#arrow)"/>

  <rect x="400" y="194" width="170" height="26" rx="13" fill="#ddf4ff" stroke="#54aeff"/>
  <circle class="mk" cx="416" cy="207" r="9"/>
  <text class="num" x="416" y="211.5" text-anchor="middle">3</text>
  <text class="pill" x="432" y="211.5">HTTPS + imzalı istek</text>

  <line class="line" x1="665" y1="182" x2="665" y2="220" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="opt" x="580" y="222" width="170" height="56" rx="8"/>
  <text class="st" x="596" y="245">Tepsi uygulaması</text>
  <text class="bd" x="596" y="265">isteğe bağlı, masaüstü</text>

  <!-- 2. Güncelleme yolu -->
  <rect x="20" y="310" width="920" height="160" rx="10" fill="#f6f8fa"/>

  <!-- backend signal starts the update line -->
  <line class="line" x1="310" y1="182" x2="310" y2="350" marker-end="url(#arrow)"/>
  <text class="lbl" x="320" y="244">güncelleme sinyali</text>
  <text class="lbl" x="320" y="262">ya da zamanlı denetim</text>
  <text class="lane" x="36" y="334">Güncelleme yolu (ayrı hat)</text>
  <text class="note" x="924" y="334" text-anchor="end">Kanal derlemede sabit: dev, preview veya stable</text>

  <rect class="box" x="30" y="352" width="166" height="98" rx="8"/>
  <text class="st" x="44" y="378">Manifest + MSI</text>
  <text class="bd" x="44" y="398">güncelleme sunucusu,</text>
  <text class="bd" x="44" y="416">kanal başına</text>
  <circle class="mk" cx="180" cy="352" r="10"/>
  <text class="num" x="180" y="356.5" text-anchor="middle">3</text>

  <rect class="box" x="216" y="352" width="166" height="98" rx="8"/>
  <text class="st" x="230" y="378">Doğrulama, hazırlık</text>
  <text class="bd" x="230" y="398">servis indirir,</text>
  <text class="bd" x="230" y="416">denetler, korumalı</text>
  <text class="bd" x="230" y="434">klasöre alır</text>
  <circle class="mk" cx="342" cy="352" r="10"/>
  <text class="num" x="342" y="356.5" text-anchor="middle">1</text>
  <circle class="mk" cx="366" cy="352" r="10"/>
  <text class="num" x="366" y="356.5" text-anchor="middle">2</text>

  <rect class="box" x="402" y="352" width="166" height="98" rx="8"/>
  <text class="st" x="416" y="378">Ayrı güncelleyici</text>
  <text class="mono" x="416" y="398">Cerberus.Agent.Updater</text>
  <text class="bd" x="416" y="416">korumalı kopyadan,</text>
  <text class="bd" x="416" y="434">LocalSystem olarak</text>
  <circle class="mk" cx="552" cy="352" r="10"/>
  <text class="num" x="552" y="356.5" text-anchor="middle">4</text>

  <rect class="box" x="588" y="352" width="166" height="98" rx="8"/>
  <text class="st" x="602" y="378">MSI kurulumu</text>
  <text class="bd" x="602" y="398">sessiz msiexec;</text>
  <text class="bd" x="602" y="416">servis durur, dosyalar</text>
  <text class="bd" x="602" y="434">değişir, yeniden başlar</text>

  <rect class="box" x="774" y="352" width="156" height="98" rx="8"/>
  <text class="st" x="788" y="378">Sağlık ve sonuç</text>
  <text class="bd" x="788" y="398">servis sağlıksızsa</text>
  <text class="bd" x="788" y="416">kurulum geri alınır;</text>
  <text class="bd" x="788" y="434">durum heartbeat'te</text>

  <line class="line" x1="196" y1="401" x2="214" y2="401" marker-end="url(#arrow)"/>
  <line class="line" x1="382" y1="401" x2="400" y2="401" marker-end="url(#arrow)"/>
  <line class="line" x1="568" y1="401" x2="586" y2="401" marker-end="url(#arrow)"/>
  <line class="line" x1="754" y1="401" x2="772" y2="401" marker-end="url(#arrow)"/>

  <!-- 3. Güvenlik noktaları -->
  <text class="lane" x="36" y="506">Güvenlik noktaları (normal sürüm yolu)</text>

  <circle class="mk" cx="46" cy="530" r="10"/>
  <text class="num" x="46" y="534.5" text-anchor="middle">1</text>
  <text class="st" x="64" y="535">İmzalı manifest</text>
  <text class="bd" x="64" y="556">RSA-SHA256 imzası derlemeye gömülü anahtarla doğrulanır.</text>
  <text class="bd" x="64" y="574">Kanal eşleşmeli; eski sürüme dönüş ve tekrar reddedilir.</text>

  <circle class="mk" cx="506" cy="530" r="10"/>
  <text class="num" x="506" y="534.5" text-anchor="middle">2</text>
  <text class="st" x="524" y="535">MSI özeti ve imzası</text>
  <text class="bd" x="524" y="556">Uzunluk ve SHA-256 özeti imzalı manifestle eşleşmeli.</text>
  <text class="bd" x="524" y="574">Authenticode imzacısı derlemede sabitlenen anahtar olmalı.</text>

  <circle class="mk" cx="46" cy="616" r="10"/>
  <text class="num" x="46" y="620.5" text-anchor="middle">3</text>
  <text class="st" x="64" y="621">TLS</text>
  <text class="bd" x="64" y="642">Manifest ve MSI yalnız HTTPS ile iner; arka uç da HTTPS.</text>
  <text class="bd" x="64" y="660">Arka uçta düz HTTP yalnız geliştirme derlemesinde, yerel adreste.</text>

  <circle class="mk" cx="506" cy="616" r="10"/>
  <text class="num" x="506" y="620.5" text-anchor="middle">4</text>
  <text class="st" x="524" y="621">Neden ayrı güncelleyici</text>
  <text class="bd" x="524" y="642">MSI servisi durdurup dosyalarını değiştirir; servis kendini</text>
  <text class="bd" x="524" y="660">değiştiremez. Güncelleyici, uygulama klasörünün dışındaki</text>
  <text class="bd" x="524" y="678">korumalı kopyadan çalışır ve 1 ile 2'yi yeniden denetler.</text>
</svg>
